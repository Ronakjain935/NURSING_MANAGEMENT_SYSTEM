<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantVerse AI – Smart Nursery & AI Crop Recommendation Platform</title>
  <meta name="description" content="AI-powered Nursery Management, Agricultural Crop Recommendation Engine, Computer Vision Leaf Pathology, and E-Commerce Platform.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- Header Navigation -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200/80 transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- Logo -->
      <div onclick="router('landing')" class="flex items-center space-x-3 cursor-pointer group">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-emerald-900 via-emerald-600 to-teal-400 flex items-center justify-center text-white shadow-md group-hover:scale-105 transition-transform">
          <i class="fa-solid fa-wheat-awn text-2xl"></i>
        </div>
        <div>
          <span class="font-extrabold text-xl tracking-tight text-slate-900 font-display">PlantVerse <span class="text-amber-500">AI</span></span>
          <span class="block text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Smart Nursery & Crop Agronomy</span>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="hidden lg:flex items-center space-x-6 text-xs sm:text-sm font-semibold text-slate-600">
        <button id="nav-landing" onclick="router('landing')" class="nav-link hover:text-emerald-600 transition-colors">Home</button>
        <button id="nav-marketplace" onclick="router('marketplace')" class="nav-link hover:text-emerald-600 transition-colors">Marketplace</button>
        <button id="nav-crop-ai" onclick="router('crop-ai')" class="nav-link hover:text-emerald-600 transition-colors flex items-center space-x-1.5">
          <i class="fa-solid fa-wheat-field text-amber-500"></i>
          <span>AI Crop Finder</span>
        </button>
        <button id="nav-ai-scan" onclick="router('ai-scan')" class="nav-link hover:text-emerald-600 transition-colors flex items-center space-x-1.5">
          <i class="fa-solid fa-camera-viewfinder text-emerald-500"></i>
          <span>AI Scan</span>
        </button>
        <button id="nav-watering-calc" onclick="router('watering-calc')" class="nav-link hover:text-emerald-600 transition-colors flex items-center space-x-1.5">
          <i class="fa-solid fa-droplet text-blue-500"></i>
          <span>Water Alarm</span>
        </button>
        <button id="nav-ai-bot" onclick="router('ai-bot')" class="nav-link hover:text-emerald-600 transition-colors flex items-center space-x-1.5">
          <i class="fa-solid fa-robot text-teal-500"></i>
          <span>AI Assistant</span>
        </button>
      </nav>

      <!-- Right Action Controls -->
      <div class="flex items-center space-x-3">
        <button onclick="router('cart')" title="Shopping Cart" class="relative w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-700 hover:text-emerald-600 hover:bg-slate-200 transition-all shadow-sm">
          <i class="fa-solid fa-bag-shopping text-base"></i>
          <span id="cart-count-badge" class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-emerald-600 text-white text-[10px] font-extrabold flex items-center justify-center hidden">0</span>
        </button>

        <!-- Dynamic Auth Container -->
        <div id="auth-header-container" class="flex items-center space-x-2">
          <button id="btn-header-auth-portal" onclick="router('user-login')" class="flex items-center space-x-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white text-xs font-extrabold px-4 py-2 rounded-xl shadow-md transition-all">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>Sign In</span>
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- Main View Container -->
  <main id="main-content" class="flex-1">
    <!-- Dynamic SPA Views rendered by app.js -->
  </main>

  <!-- Footer -->
  <footer class="bg-slate-950 text-slate-400 py-16 border-t border-slate-800 mt-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-4">
      <div class="flex items-center justify-center space-x-2 text-white">
        <i class="fa-solid fa-wheat-awn text-amber-500 text-2xl"></i>
        <span class="font-extrabold text-xl">PlantVerse AI Platform v3.0</span>
      </div>
      <p class="text-xs text-slate-400 max-w-lg mx-auto leading-relaxed">
        AI-Powered Nursery Management, Agricultural Crop Recommendation System, Leaf Disease Computer Vision, and E-Commerce Platform.
      </p>
      <p class="text-[11px] text-slate-600">© 2026 PlantVerse AI. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
